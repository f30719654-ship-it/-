plugins {
    id 'fabric-loom' version '1.2.0'
    id 'java'
}

group = 'com.example'
version = '1.0.0'
archivesBaseName = 'meteor-like-bed-aura-client'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.14.25"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.81.0+1.21.11"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}
